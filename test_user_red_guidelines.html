<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1280px; height: 720px; overflow: hidden;
  background: url('user_lines_on_frame_1280.png') no-repeat center center;
  background-size: cover; position: relative;
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
}
.stage {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  perspective: 1200px;
  perspective-origin: 50% 42%;
}

/* Translucent holographic cards calibrated directly to the user's red guides */
.holo-card {
  position: absolute;
  border-radius: 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  
  /* Translucent frosted crystal */
  background: linear-gradient(180deg, 
    rgba(255, 255, 255, 0.16) 0%, 
    rgba(180, 230, 255, 0.06) 40%, 
    rgba(100, 200, 255, 0.05) 70%, 
    rgba(0, 225, 255, 0.12) 100%
  );
  backdrop-filter: blur(5px) saturate(115%) brightness(1.02);
  -webkit-backdrop-filter: blur(5px) saturate(115%) brightness(1.02);

  /* Cyan electric neon border */
  border: 2px solid #5de4ff;
  box-shadow: 
    0 0 10px rgba(0, 240, 255, 0.7),
    0 0 20px rgba(0, 240, 255, 0.35),
    inset 0 1px 2px rgba(255, 255, 255, 0.8),
    inset 0 0 10px rgba(0, 230, 255, 0.15);
  
  transform-style: preserve-3d;
}

.holo-card::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 21px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-top-color: rgba(255, 255, 255, 0.85);
  pointer-events: none;
}

.holo-card::before {
  content: '';
  position: absolute;
  top: 0; left: 12%; right: 12%; height: 2px;
  background: linear-gradient(90deg, transparent 0%, #ffffff 30%, #5de4ff 70%, transparent 100%);
  filter: blur(0.5px);
  pointer-events: none;
}

.holo-card span {
  position: relative;
  z-index: 3;
  color: #ffffff;
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  font-weight: 700;
  font-size: 48px;
  letter-spacing: -0.01em;
  line-height: 1;
  text-shadow: 0 2px 4px rgba(0, 15, 45, 0.35), 0 0 12px rgba(90, 220, 255, 0.5);
}

.holo-card.double-line span {
  font-size: 46px;
  line-height: 1.05;
}

/* 1. Colegio: +2px right, +2px bottom */
.hotspot-colegios {
  left: 8.35%; top: 32.2%;
  width: 19.01%; height: 22.08%;
  transform: rotateY(16deg) rotateX(0.5deg);
  transform-origin: center right;
}

/* 2. Canadá: -4px left, +2px bottom */
.hotspot-canada {
  left: 46.51%; top: 32.6%;
  width: 20.69%; height: 22.58%;
  transform: rotateY(0deg);
  transform-origin: center center;
}

/* 3. Emisora Digital: -3px right */
.hotspot-emisora {
  left: 69.5%; top: 31.4%;
  width: 21.77%; height: 24.0%;
  transform: rotateY(-5deg) rotateX(0.5deg);
  transform-origin: center left;
}
</style>
</head>
<body>
<div class="stage">
  <div class="holo-card hotspot-colegios"><span>Colegio</span></div>
  <div class="holo-card hotspot-canada"><span>Canadá</span></div>
  <div class="holo-card double-line hotspot-emisora"><span>Emisora<br>Digital</span></div>
</div>
</body>
</html>
